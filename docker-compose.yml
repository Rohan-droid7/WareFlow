version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
      - "8001:8001"
    env_file:
      - backend/.env
    volumes:
      - ./checkpoints:/app/checkpoints:ro
      - ./ml:/app/../ml:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: frontend
      args:
        VITE_API_BASE: http://localhost:8001
        VITE_P2_API: http://localhost:8000
        VITE_WS_URL: ws://localhost:8000/ws
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
